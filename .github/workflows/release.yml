name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install ".[test,release]"
      - name: Require the tag to match package metadata
        shell: bash
        run: |
          package_version="$(python -c 'import flowyaml; print(flowyaml.__version__)')"
          test "${GITHUB_REF_NAME#v}" = "$package_version"
      - name: Run tests
        run: python -m pytest tests -q -m "not browser"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel installation
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install dist/*.whl
          wheel-check/bin/python -c "import flowyaml; assert flowyaml.__version__ == '${GITHUB_REF_NAME#v}'"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flowyaml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          print-hash: true
