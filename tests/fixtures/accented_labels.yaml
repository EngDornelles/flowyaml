# Non-ASCII labels, shaped like the originating source. The generated
# document declares <meta charset="utf-8">, so every output path has to emit
# UTF-8 regardless of the console codepage it happens to be running under.
meta:
  id: acentos
  name: "Distribuição e Encerramento de Processos"
  version: "1.0.0"
  description: "Fluxo com acentuação, travessão — e aspas \"tipográficas\"."

nodes:
  - id: start
    type: startEvent
    label: "Início do processo"
  - id: secao
    type: task
    label: "Seção de Administração Predial"
  - id: end
    type: endEvent
    label: "Processo encerrado"

edges:
  - from: start
    to: secao
    tag: "Sim"
  - from: secao
    to: end
    tag: "Não"
    label: "Encaminhado à Diretoria para decisão de encerramento."
