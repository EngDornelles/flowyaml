[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowyaml"
version = "0.1.0"
description = "Callable Python renderer that turns YAML-defined process flows into offline, self-sufficient HTML."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dornelles Multitech" }]
keywords = ["yaml", "flowchart", "diagram", "elk", "svg", "renderer"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
browser = ["playwright>=1.40"]

[project.scripts]
flowyaml = "flowyaml.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowyaml = ["assets/*.js", "assets/*.css", "assets/*.txt", "assets/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: headless-browser smoke tests (require playwright + chromium)",
]
filterwarnings = ["error::DeprecationWarning:flowyaml.*"]
