[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "flowyaml"
dynamic = ["version"]
description = "Callable Python renderer that turns YAML-defined process flows into offline, self-sufficient HTML."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Dornelles Multitech" }]
license = "MIT"
license-files = ["LICENSE", "NOTICE.md", "src/flowyaml/assets/elk.LICENSE.md"]
keywords = ["yaml", "flowchart", "diagram", "elk", "svg", "renderer"]
dependencies = ["PyYAML>=6.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/EngDornelles/flowyaml"
Repository = "https://github.com/EngDornelles/flowyaml"
Issues = "https://github.com/EngDornelles/flowyaml/issues"

[project.optional-dependencies]
test = ["pytest>=7.4"]
browser = ["playwright>=1.40"]
release = ["build>=1.2,<2", "twine>=6,<8"]

[project.scripts]
flowyaml = "flowyaml.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flowyaml = ["py.typed", "assets/*.js", "assets/*.css", "assets/*.txt", "assets/*.md"]

[tool.setuptools.dynamic]
version = { attr = "flowyaml._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: headless-browser smoke tests (require playwright + chromium)",
]
filterwarnings = ["error::DeprecationWarning:flowyaml.*"]
